<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CausalMap · 10 000-node Cluster Demo</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }
      h1 { font-size: 1.6rem; margin-bottom: 4px; }
      .subtitle { color: #999; font-size: 0.9rem; margin-bottom: 16px; }
      #stats {
        display: flex; gap: 24px; margin-bottom: 16px;
        font-size: 0.85rem; color: #bbb;
      }
      #stats strong { color: #eee; }
      #canvas-wrap {
        background: #0f0f23;
        border: 1px solid #333;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 80px rgba(0,0,0,0.5);
      }
      .legend {
        display: flex; gap: 20px; margin-top: 14px; font-size: 0.82rem; color: #aaa;
      }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend i {
        display: inline-block; width: 28px; height: 3px; border-radius: 2px;
      }
      .legend .solid { border-bottom: 2.5px solid #eee; }
      .legend .dashed { border-bottom: 2.5px dashed #eee; }
    </style>
  </head>
  <body>
    <h1>CausalMap · 10 000-Node Cluster Demo</h1>
    <p class="subtitle">Voronoi tessellation → GVMap polygon merging → 2-level hierarchy</p>
    <div id="stats">
      <span>Nodes: <strong id="n-nodes">…</strong></span>
      <span>Fine clusters: <strong id="n-fine">…</strong></span>
      <span>Coarse clusters: <strong id="n-coarse">…</strong></span>
      <span>Voronoi: <strong id="t-voronoi">…</strong></span>
      <span>Merge: <strong id="t-merge">…</strong></span>
      <span>Total: <strong id="t-total">…</strong></span>
    </div>
    <div id="canvas-wrap">
      <div id="app"></div>
    </div>
    <div class="legend">
      <span><i class="solid"></i> Coarse-level regions (solid)</span>
      <span><i class="dashed"></i> Fine-level regions (dashed)</span>
    </div>
    <script type="module" src="/src/clusterDemo.ts"></script>
  </body>
</html>
